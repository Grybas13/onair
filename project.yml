# XcodeGen projekto aprašas. Projektas generuojamas automatiškai GitHub Actions
# (.github/workflows/build.yml). Mac'e ranka: brew install xcodegen && xcodegen

name: OnAir

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OnAir:
    type: application
    platform: iOS
    sources:
      - path: OnAir
    dependencies:
      # Live Activity (užrakintas ekranas, Dynamic Island).
      - target: OnAirWidget
    scheme: {}
    info:
      path: OnAir/Info.plist
      properties:
        CFBundleDisplayName: OnAir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        LastFMAPIKey: $(LASTFM_API_KEY)
        GroqAPIKey: $(GROQ_API_KEY)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Leidžia programėlei veikti fone (DJ balsas, eilės sekimas).
        UIBackgroundModes:
          - audio
        # Leidžia atidaryti Spotify programėlę.
        LSApplicationQueriesSchemes:
          - spotify
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lt.grybas13.onair
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SPOTIFY_CLIENT_ID: ""
        LASTFM_API_KEY: ""
        GROQ_API_KEY: ""

  OnAirWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OnAirWidget
      - path: OnAir/Shared
    info:
      path: OnAirWidget/Info.plist
      properties:
        CFBundleDisplayName: OnAir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lt.grybas13.onair.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
