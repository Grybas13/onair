# XcodeGen projekto aprašas. Projektas generuojamas automatiškai GitHub Actions
# (.github/workflows/build.yml). Mac'e ranka: brew install xcodegen && xcodegen

name: OnAir

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  # Kokoro neuroninis balsas (MLX). Prisegta prie konkrečios versijos, kad kompiliavimas būtų stabilus.
  KokoroSwift:
    url: https://github.com/mlalma/kokoro-ios
    revision: 4d6d1d8ff8cd012014180c9cd4cf0151e7682354
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.30.2
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: 0.0.6

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OnAir:
    type: application
    platform: iOS
    sources:
      - path: OnAir
    dependencies:
      - package: KokoroSwift
        # KokoroSwift yra dinaminė biblioteka – ją būtina įdėti į programėlę.
        embed: true
      - package: MLXSwift
        product: MLX
      - package: MLXUtilsLibrary
    scheme: {}
    info:
      path: OnAir/Info.plist
      properties:
        CFBundleDisplayName: OnAir
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        LastFMAPIKey: $(LASTFM_API_KEY)
        GroqAPIKey: $(GROQ_API_KEY)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Leidžia programėlei veikti fone (DJ balsas, eilės sekimas).
        UIBackgroundModes:
          - audio
        # Leidžia atidaryti Spotify programėlę.
        LSApplicationQueriesSchemes:
          - spotify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lt.grybas13.onair
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SPOTIFY_CLIENT_ID: ""
        LASTFM_API_KEY: ""
        GROQ_API_KEY: ""
