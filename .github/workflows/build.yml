name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install Metal toolchain (needed by MLX)
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain download skipped"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID secret is not set - app will build, but login will not work."
          fi
          set -o pipefail
          xcodebuild \
            -project OnAir.xcodeproj \
            -scheme OnAir \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            LASTFM_API_KEY="$LASTFM_API_KEY" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            build 2>&1 | tee build.log

      - name: Report compiler errors and warnings
        if: always()
        run: |
          if [ -f build.log ]; then
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "warning:" build.log | grep -v "ld: warning" | sort -u | head -40 | while IFS= read -r line; do echo "::warning::$line"; done
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OnAir.app Payload/
          zip -qry OnAir.ipa Payload
          ls -lh OnAir.ipa

      - name: Verify app bundle
        run: |
          APP=Payload/OnAir.app
          PB=/usr/libexec/PlistBuddy
          echo "Bundle ID:      $($PB -c 'Print :CFBundleIdentifier' $APP/Info.plist)"
          echo "Min iOS:        $($PB -c 'Print :MinimumOSVersion' $APP/Info.plist)"
          echo "Background:     $($PB -c 'Print :UIBackgroundModes:0' $APP/Info.plist)"
          echo "Xcode:          $($PB -c 'Print :DTXcode' $APP/Info.plist)"
          lipo -info $APP/OnAir
          echo "Size: $(du -sh $APP | cut -f1)"
          echo "Frameworks:"; ls $APP/Frameworks 2>/dev/null || echo "(none)"
          echo "Metal libraries:"; find $APP -name "*.metallib" | sed "s|$APP/||" || true
          echo "Voices: $(ls -la $APP/voices.npz 2>/dev/null | awk '{print $5}')"
          # Kiekviena @rpath biblioteka turi būti įdėta, kitaip programėlė nepasileis.
          MISSING=0
          for LIB in $(otool -L $APP/OnAir | awk '/@rpath/ {print $1}'); do
            NAME=$(basename "$(dirname "$LIB")")
            if [ ! -e "$APP/Frameworks/$NAME" ]; then
              echo "::error::Missing embedded framework: $LIB"
              MISSING=1
            fi
          done
          if [ ! -e "$APP/voices.npz" ]; then echo "::error::voices.npz is not in the app bundle"; MISSING=1; fi
          [ $MISSING -eq 0 ] || exit 1
          for KEY in SpotifyClientID LastFMAPIKey GroqAPIKey; do
            LEN=$($PB -c "Print :$KEY" $APP/Info.plist | tr -d '\n' | wc -c | tr -d ' ')
            echo "$KEY length: $LEN"
            if [ "$LEN" -lt 10 ]; then
              echo "::warning::$KEY is missing from this build. Add the matching GitHub secret and re-run."
            fi
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OnAir-ipa
          path: OnAir.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
